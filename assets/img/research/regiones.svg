<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-label="Regiones de parámetros donde el planificador excluye fintechs, admite a ambos o excluye bancos">
<style>
  .ttl{font-family:Raleway,Helvetica,Arial,sans-serif;font-size:13px;font-weight:700;fill:#173b6c}
  .lb{font-family:Poppins,Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;letter-spacing:1.1px;fill:#0b6d9e}
  .t{font-family:'Open Sans',Helvetica,Arial,sans-serif;font-size:11.5px;fill:#173b6c}
  .s{font-family:'Open Sans',Helvetica,Arial,sans-serif;font-size:11px;fill:#5f7391}
  .bank{fill:#fff;stroke:#0b6d9e;stroke-width:2}
  .fin{fill:#149ddd;stroke:#fff;stroke-width:2.5}
  .cons{fill:#9db9d6}
  .ring{fill:none;stroke:#cfe0f2;stroke-width:2}
  .spoke{stroke:#c6dbef;stroke-width:1.2;stroke-dasharray:3 4}
  .arc{fill:none;stroke:#149ddd;stroke-width:2.5}
</style>
<rect width="900" height="330" fill="#fff"/>
<text class="lb" x="24" y="30">EL RESULTADO · QUÉ QUIERE EL PLANIFICADOR SEGÚN LOS PARÁMETROS</text>
<rect x="24" y="58" width="276" height="150" rx="9" fill="#dcf5e9" stroke="#cfe0f2" stroke-width="1.2"/>
<text class="ttl" x="42" y="88" style="fill:#0f6b46">Excluir a la fintech</text>
<text class="s" x="42" y="112">La ganancia por especialización</text>
<text class="s" x="42" y="130">de los bancos pesa más que su</text>
<text class="s" x="42" y="148">costo de intermediación.</text>
<rect x="312" y="58" width="276" height="150" rx="9" fill="#dff3fc" stroke="#cfe0f2" stroke-width="1.2"/>
<text class="ttl" x="330" y="88" style="fill:#0b6d9e">Admitir a ambos</text>
<text class="s" x="330" y="112">Ninguno domina: la variedad</text>
<text class="s" x="330" y="130">bancaria y el alcance de la</text>
<text class="s" x="330" y="148">fintech se complementan.</text>
<rect x="600" y="58" width="276" height="150" rx="9" fill="#fdf0d5" stroke="#cfe0f2" stroke-width="1.2"/>
<text class="ttl" x="618" y="88" style="fill:#8a5a00">Excluir a los bancos</text>
<text class="s" x="618" y="112">Los costos fijos bancarios son</text>
<text class="s" x="618" y="130">tan altos que el mercado queda</text>
<text class="s" x="618" y="148">desatendido; la fintech lo cubre.</text>
<line x1="24" y1="230" x2="876" y2="230" stroke="#cfe0f2" stroke-width="2" marker-end="url(#a2)"/>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#cfe0f2"/></marker></defs>
<text class="s" x="24" y="252">costo fijo de operar un banco  →  crece</text>
<text class="ttl" x="24" y="292">El intercambio de fondo</text>
<text class="s" x="24" y="312">Variedad y especialización que aportan los bancos, contra el costo de intermediación: cada banco paga su propio costo fijo, la fintech uno solo.</text>
</svg>