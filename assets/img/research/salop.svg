<text class="t" x="300" y="219" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:11px">FIN</text>
<text class="ttl" x="300" y="397" text-anchor="middle">Consumidores repartidos por el perímetro</text>
<text class="ttl" x="530" y="78">Bancos</text>
<text class="s" x="530" y="98">Se ubican simétricamente sobre el círculo.</text>
<text class="s" x="530" y="115">Cada uno paga su propio costo fijo y tiene</text>
<text class="s" x="530" y="132">ventaja geográfica solo con los clientes cercanos.</text>
<text class="ttl" x="530" y="186">Fintech</text>
<text class="s" x="530" y="206">Se sitúa dentro del círculo, equidistante</text>
<text class="s" x="530" y="223">de todos los clientes: llega a todos por igual,</text>
<text class="s" x="530" y="240">sin ventaja ni desventaja de ubicación.</text>
<text class="ttl" x="530" y="294">La fricción</text>
<text class="s" x="530" y="314">Con costos fijos el mercado no es de competencia</text>
<text class="s" x="530" y="331">perfecta: entran demasiados bancos y todos se</text>
<text class="s" x="530" y="348">especializan menos de lo que sería óptimo.</text>
