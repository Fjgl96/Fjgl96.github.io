<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="856" height="476" viewBox="0 0 856 476" role="img" aria-labelledby="t-c d-c">
<title id="t-c">Grafo causal del costo de capital</title>
<desc id="d-c">Subir la deuda recorre dos cadenas a la vez. Por arriba eleva la beta reapalancada y con ella el costo del equity. Por abajo deteriora la cobertura de intereses, baja el rating sintético, ensancha el spread y encarece la deuda. Ambas desembocan en el WACC, donde compiten con el escudo fiscal.</desc>
<defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9db9d6"/></marker></defs>
<style>
 .t{font-family:Raleway,Helvetica,Arial,sans-serif;font-size:11.5px;font-weight:700;fill:#173b6c}
 .f{font-family:'Courier New',monospace;font-size:9.5px;fill:#5f7391}
 .val{font-family:Poppins,Helvetica,Arial,sans-serif;font-size:9.5px;font-weight:600;fill:#0b6d9e}
 .h{font-family:Poppins,Helvetica,Arial,sans-serif;font-size:9.5px;font-weight:600;letter-spacing:1px;fill:#0b6d9e}
 .lb{font-family:Poppins,Helvetica,Arial,sans-serif;font-size:8.5px;font-weight:600;letter-spacing:.9px;fill:#a8b6cc}
 .n{font-family:'Open Sans',Helvetica,Arial,sans-serif;font-size:10.5px;fill:#5f7391}
 .sg{font-family:Poppins,Helvetica,Arial,sans-serif;font-size:11px;font-weight:700}
 .ln{stroke:#9db9d6;stroke-width:1.7;fill:none;marker-end:url(#fa)}
</style>
<rect width="856" height="476" fill="#fff"/>
<text class="h" x="16" y="24">EL GRAFO CAUSAL · QUÉ MUEVE EL WACC CUANDO SE MUEVE LA DEUDA</text>
<text class="lb" x="16" y="214">LA PALANCA</text>
<rect x="16" y="222" width="120" height="62" rx="8" fill="#dff3fc" stroke="#9fd4ef" stroke-width="1.3"/><text class="t" x="76.0" y="242" text-anchor="middle">D / E &#8593;</text><text class="val" x="76.0" y="258" text-anchor="middle">0,67</text>
<text class="lb" x="196" y="62">CADENA DEL ACCIONISTA</text>
<rect x="196" y="70" width="180" height="66" rx="8" fill="#fff" stroke="#cfe0f2" stroke-width="1.3"/><text class="t" x="286.0" y="91" text-anchor="middle">Beta reapalancada</text><text class="f" x="286.0" y="107" text-anchor="middle">&#946;L = &#946;U[1+(1&#8722;t)D/E]</text><text class="val" x="286.0" y="123" text-anchor="middle">0,89 &#8594; 1,31</text>
<rect x="424" y="70" width="180" height="66" rx="8" fill="#fff" stroke="#cfe0f2" stroke-width="1.3"/><text class="t" x="514.0" y="91" text-anchor="middle">Costo del equity</text><text class="f" x="514.0" y="107" text-anchor="middle">Re = RF + &#946;L &#183; ERPef</text><text class="val" x="514.0" y="123" text-anchor="middle">13,13 %</text>
<path class="ln" d="M136 240 C166.0 240 166.0 108 196 108"/><circle cx="168" cy="168" r="9" fill="#fff" stroke="#b33a3a" stroke-width="1.5"/><text class="sg" x="168" y="172" text-anchor="middle" fill="#b33a3a">+</text>
<path class="ln" d="M376 103 L424 103"/><circle cx="400" cy="103" r="9" fill="#fff" stroke="#b33a3a" stroke-width="1.5"/><text class="sg" x="400" y="107" text-anchor="middle" fill="#b33a3a">+</text>
<text class="lb" x="196" y="192">CADENA DEL ACREEDOR</text>
<rect x="196" y="200" width="180" height="50" rx="8" fill="#fff" stroke="#cfe0f2" stroke-width="1.3"/><text class="t" x="286.0" y="220" text-anchor="middle">Cobertura EBIT / int.</text><text class="val" x="286.0" y="236" text-anchor="middle">4,29&#215;</text>
<rect x="196" y="274" width="180" height="50" rx="8" fill="#fff" stroke="#cfe0f2" stroke-width="1.3"/><text class="t" x="286.0" y="294" text-anchor="middle">Rating &#8594; spread</text><text class="val" x="286.0" y="310" text-anchor="middle">A+ &#183; 2,32 %</text>
<rect x="424" y="226" width="180" height="66" rx="8" fill="#fff" stroke="#cfe0f2" stroke-width="1.3"/><text class="t" x="514.0" y="247" text-anchor="middle">Costo de la deuda</text><text class="f" x="514.0" y="263" text-anchor="middle">Rd = (RF+spread)(1&#8722;t)</text><text class="val" x="514.0" y="279" text-anchor="middle">4,70 %</text>
<path class="ln" d="M136 252 L196 225"/><circle cx="168" cy="232" r="9" fill="#fff" stroke="#0f6b46" stroke-width="1.5"/><text class="sg" x="168" y="236" text-anchor="middle" fill="#0f6b46">&#8722;</text>
<path class="ln" d="M286 250 L286 274"/><circle cx="310" cy="262" r="9" fill="#fff" stroke="#0f6b46" stroke-width="1.5"/><text class="sg" x="310" y="266" text-anchor="middle" fill="#0f6b46">&#8722;</text>
<path class="ln" d="M376 299 L424 270"/><circle cx="400" cy="285" r="9" fill="#fff" stroke="#b33a3a" stroke-width="1.5"/><text class="sg" x="400" y="289" text-anchor="middle" fill="#b33a3a">+</text>
<text class="lb" x="196" y="358">CONTEXTO EXTERNO</text>
<rect x="196" y="366" width="180" height="50" rx="8" fill="#f5f8fd" stroke="#cfe0f2" stroke-width="1.3"/><text class="t" x="286.0" y="386" text-anchor="middle">Prima efectiva</text><text class="val" x="286.0" y="402" text-anchor="middle">ERP + &#955;&#215;país &#183; 6,69 %</text>
<path class="ln" d="M376 391 C438.0 391 438.0 140 500 140"/><circle cx="415" cy="336" r="9" fill="#fff" stroke="#b33a3a" stroke-width="1.5"/><text class="sg" x="415" y="340" text-anchor="middle" fill="#b33a3a">+</text>
<rect x="652" y="156" width="188" height="80" rx="8" fill="#dcf5e9" stroke="#8fd4b4" stroke-width="1.3"/><text class="t" x="746.0" y="177" text-anchor="middle">WACC</text><text class="f" x="746.0" y="193" text-anchor="middle">Re&#183;E/V + Rd&#183;D/V</text><text class="val" x="746.0" y="209" text-anchor="middle">9,76 %</text>
<path class="ln" d="M604 103 C628.0 103 628.0 178 652 178"/>
<path class="ln" d="M604 259 C628.0 259 628.0 216 652 216"/>
<circle cx="660" cy="292" r="9" fill="#fff" stroke="#b33a3a" stroke-width="1.5"/><text class="sg" x="660" y="296" text-anchor="middle" fill="#b33a3a">+</text>
<text class="n" x="674" y="296">lo empuja hacia arriba</text>
<circle cx="660" cy="318" r="9" fill="#fff" stroke="#0f6b46" stroke-width="1.5"/><text class="sg" x="660" y="322" text-anchor="middle" fill="#0f6b46">&#8722;</text>
<text class="n" x="674" y="322">lo empuja hacia abajo</text>
<text class="n" x="16" y="444">Más deuda encarece el equity y, pasado cierto punto, también la deuda: el rating sintético castiga la cobertura justo cuando la empresa más</text>
<text class="n" x="16" y="462">necesita financiarse. El escudo fiscal empuja en sentido contrario. El mínimo del WACC está donde esas tres fuerzas se cruzan.</text>
</svg>