<rect x="706" y="46" width="134" height="322" rx="8" fill="#f5f8fd" stroke="#cfe0f2" stroke-width="1.2"/>
<text class="h" x="720" y="70">DE LA SUMA</text>
<text class="pt" x="720" y="108" style="font-size:10px">Pérdida máxima</text>
<text x="720" y="138" font-family="Raleway,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#b33a3a">&#8722;4</text>
<text class="n" x="720" y="156">el débito neto: 6 &#8722; 2</text>
<text class="pt" x="720" y="196" style="font-size:10px">Equilibrio</text>
<text x="720" y="226" font-family="Raleway,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#0f6b46">99</text>
<text class="n" x="720" y="244">K1 + débito neto</text>
<text class="pt" x="720" y="284" style="font-size:10px">Ganancia máxima</text>
<text x="720" y="314" font-family="Raleway,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#0b6d9e">+6</text>
<text class="n" x="720" y="332">(105 &#8722; 95) &#8722; 4</text>
</svg>