<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="856" height="384" viewBox="0 0 856 384" role="img" aria-labelledby="t-p d-p">
<title id="t-p">Una estrategia es la suma de sus patas</title>
<desc id="d-p">Tres paneles. El primero muestra el resultado de comprar una call con strike noventa y cinco pagando seis: pierde la prima hasta el strike y luego sube sin techo. El segundo, el de vender una call con strike ciento cinco cobrando dos: cobra la prima hasta el strike y luego cae sin piso. El tercero suma ambos punto por punto; las dos ramas sin límite se cancelan y la silueta resultante queda acotada, con pérdida máxima de cuatro, ganancia máxima de seis y punto de equilibrio en noventa y nueve. Ninguno de esos tres números se memoriza: salen de la suma.</desc>
<style>
 .h{font-family:Poppins,Helvetica,Arial,sans-serif;font-size:9.5px;font-weight:600;letter-spacing:1px;fill:#0b6d9e}
 .pt{font-family:Raleway,Helvetica,Arial,sans-serif;font-size:11px;font-weight:700;fill:#173b6c}
 .hi{font-family:Poppins,Helvetica,Arial,sans-serif;font-size:8.5px;font-weight:600}
 .op{font-family:Raleway,Helvetica,Arial,sans-serif;font-size:24px;font-weight:700;fill:#9db9d6}
 .n{font-family:'Open Sans',Helvetica,Arial,sans-serif;font-size:9px;fill:#5f7391}
 .an{font-family:Poppins,Helvetica,Arial,sans-serif;font-size:8.5px;font-weight:600;fill:#5f7391}
</style>
<rect width="856" height="384" fill="#fff"/>
