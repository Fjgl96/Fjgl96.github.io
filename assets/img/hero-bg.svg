    <polyline points="140,930 380,884 620,900 860,806 1100,838 1340,724 1580,690 1820,600"
              stroke="#ffffff" stroke-opacity="0.10" stroke-width="3" stroke-dasharray="10 12"/>
  </g>
  <g fill="#149ddd" fill-opacity="0.55">
    <circle cx="380" cy="742" r="6"/><circle cx="860" cy="610" r="6"/>
    <circle cx="1340" cy="470" r="6"/><circle cx="1820" cy="268" r="6"/>
  </g>
