<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050d18"/>
      <stop offset="55%" stop-color="#08182b"/>
      <stop offset="100%" stop-color="#0b2138"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="32%" r="52%">
      <stop offset="0%" stop-color="#149ddd" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#149ddd" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#149ddd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="18%" cy="82%" r="46%">
      <stop offset="0%" stop-color="#1f5297" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1f5297" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
