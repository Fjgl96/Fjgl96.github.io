<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="856" height="252" viewBox="0 0 856 252" role="img" aria-labelledby="ti-tutoria-cfa de-tutoria-cfa">
<title id="ti-tutoria-cfa">Cu&#225;ndo suelta informaci&#243;n</title>
<desc id="de-tutoria-cfa">Diagrama de decisi&#243;n. La secuencia principal va de Un caso con su pregunta luego Pr&#225;ctica o simulacro luego El candidato escribe luego Qu&#233; tipo de error luego Correcci&#243;n y veredicto. En &#191;Pr&#225;ctica o simulacro? el flujo espera a una persona: Elige el candidato, cambia cu&#225;nto se le adelanta. En El candidato escribe el flujo se detiene: Sin respuesta escrita, no hay correcci&#243;n: no es un solucionario. En &#191;Qu&#233; tipo de error? el flujo vuelve atrás: Una pista, un pelda&#241;o, y solo si sigue trabado.</desc>
<defs><marker id="fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9db9d6"/></marker><marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5f7391"/></marker></defs>
