<text x="24" y="22" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1" fill="#0b6d9e">POR D&#243;NDE PUEDE SALIRSE</text>
<rect x="24.0" y="38" width="140.8" height="68" rx="7" fill="#f5f8fd" stroke="#0b6d9e" stroke-width="1.3"/><text x="34.0" y="57" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#0b6d9e">Estados financieros</text><text x="34.0" y="72" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">PDF o Excel, uno o varios</text><text x="34.0" y="83" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">periodos</text>
<line x1="169.8" y1="72.0" x2="186.8" y2="72.0" stroke="#9db9d6" stroke-width="1.6" marker-end="url(#fd)"/>
<rect x="190.8" y="38" width="140.8" height="68" rx="7" fill="#fff" stroke="#173b6c" stroke-width="1.3"/><text x="200.8" y="57" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#173b6c">&#191;Qu&#233; sector?</text><text x="200.8" y="72" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">nueve m&#243;dulos, cada uno con</text><text x="200.8" y="83" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">sus umbrales</text>
<line x1="336.6" y1="72.0" x2="353.6" y2="72.0" stroke="#9db9d6" stroke-width="1.6" marker-end="url(#fd)"/>
<rect x="357.6" y="38" width="140.8" height="68" rx="7" fill="#fff" stroke="#173b6c" stroke-width="1.3"/><text x="367.6" y="57" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#173b6c">&#191;Los datos cuadran?</text><text x="367.6" y="72" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">minuta contable antes que las</text><text x="367.6" y="83" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">l&#225;minas</text>
<line x1="503.4" y1="72.0" x2="520.4" y2="72.0" stroke="#9db9d6" stroke-width="1.6" marker-end="url(#fd)"/>
<rect x="524.4" y="38" width="140.8" height="68" rx="7" fill="#fff" stroke="#173b6c" stroke-width="1.3"/><text x="534.4" y="57" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#173b6c">&#191;Diagn&#243;stico o mensual?</text><text x="534.4" y="72" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">cambia el juego de l&#225;minas</text>
<line x1="670.2" y1="72.0" x2="687.2" y2="72.0" stroke="#9db9d6" stroke-width="1.6" marker-end="url(#fd)"/>
