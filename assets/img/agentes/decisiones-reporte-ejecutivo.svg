<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="856" height="252" viewBox="0 0 856 252" role="img" aria-labelledby="ti-reporte-ejecutivo de-reporte-ejecutivo">
<title id="ti-reporte-ejecutivo">Por d&#243;nde puede salirse</title>
<desc id="de-reporte-ejecutivo">Diagrama de decisi&#243;n. La secuencia principal va de Estados financieros luego Qu&#233; sector luego Los datos cuadran luego Diagn&#243;stico o mensual luego L&#225;minas y minuta. En &#191;Qu&#233; sector? el flujo espera a una persona: Lo confirma el usuario, el sector se detecta del archivo, no se asume. En &#191;Los datos cuadran? el flujo se detiene: Va a contabilidad, el dato malo se corrige ah&#237;, no llega al directorio. En L&#225;minas y minuta el flujo vuelve atrás: Revisi&#243;n visual, colisiones y desbordes antes de entregar.</desc>
<defs><marker id="fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9db9d6"/></marker><marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5f7391"/></marker></defs>
