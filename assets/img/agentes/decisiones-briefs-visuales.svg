<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="856" height="252" viewBox="0 0 856 252" role="img" aria-labelledby="ti-briefs-visuales de-briefs-visuales">
<title id="ti-briefs-visuales">El umbral que decide si sale</title>
<desc id="de-briefs-visuales">Diagrama de decisi&#243;n. La secuencia principal va de Un concepto a ilustrar luego Estilo luego Escena y restricciones luego Llega al umbral luego Instrucci&#243;n lista. En Escena y restricciones el flujo se detiene: El dato exacto no entra, se sobrepone despu&#233;s en edici&#243;n. En &#191;Llega al umbral? el flujo vuelve atrás: Motor de iteraci&#243;n, por debajo del umbral se reescribe. En Instrucci&#243;n lista el flujo espera a una persona: Se revisa a ojo, siempre, antes de publicar.</desc>
<defs><marker id="fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9db9d6"/></marker><marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5f7391"/></marker></defs>
