<line x1="336.6" y1="72.0" x2="353.6" y2="72.0" stroke="#9db9d6" stroke-width="1.6" marker-end="url(#fd)"/>
<rect x="357.6" y="38" width="140.8" height="68" rx="7" fill="#fff" stroke="#173b6c" stroke-width="1.3"/><text x="367.6" y="57" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#173b6c">Escena y restricciones</text><text x="367.6" y="72" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">incluye qu&#233; no debe aparecer</text>
<line x1="503.4" y1="72.0" x2="520.4" y2="72.0" stroke="#9db9d6" stroke-width="1.6" marker-end="url(#fd)"/>
<rect x="524.4" y="38" width="140.8" height="68" rx="7" fill="#fff" stroke="#173b6c" stroke-width="1.3"/><text x="534.4" y="57" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#173b6c">&#191;Llega al umbral?</text><text x="534.4" y="72" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">autoevaluaci&#243;n con lista de</text><text x="534.4" y="83" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">control</text>
