<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="856" height="252" viewBox="0 0 856 252" role="img" aria-labelledby="ti-investigacion-redaccion de-investigacion-redaccion">
<title id="ti-investigacion-redaccion">D&#243;nde se cae un tema</title>
<desc id="de-investigacion-redaccion">Diagrama de decisi&#243;n. La secuencia principal va de Un hecho financiero luego Investigaci&#243;n luego La tesis se sostiene luego Estilo y audiencia luego Publicaci&#243;n o ensayo. En Investigaci&#243;n el flujo se detiene: Cifra sin respaldo, no se publica; lo aproximado se marca como tal. En &#191;La tesis se sostiene? el flujo vuelve atrás: Se reencuadra el &#225;ngulo, o se descarta el tema por completo. En Estilo y audiencia el flujo espera a una persona: Elige el usuario, cambian vocabulario y profundidad, no el rigor.</desc>
