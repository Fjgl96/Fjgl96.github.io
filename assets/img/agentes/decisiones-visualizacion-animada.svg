<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="856" height="252" viewBox="0 0 856 252" role="img" aria-labelledby="ti-visualizacion-animada de-visualizacion-animada">
<title id="ti-visualizacion-animada">El dato poda antes que la narrativa</title>
<desc id="de-visualizacion-animada">Diagrama de decisi&#243;n. La secuencia principal va de Datos de entrada luego Filtro estructural luego &#193;ngulos posibles luego Plantilla luego HTML de 14 segundos. En Filtro estructural el flujo se detiene: No sobrevive ninguno, la forma del dato no admite ese gr&#225;fico. En &#193;ngulos posibles el flujo espera a una persona: Elige el usuario, la narrativa escoge entre lo que qued&#243;. En HTML de 14 segundos el flujo vuelve atrás: Precisi&#243;n y colisiones, un solo dato mal mata la pieza entera.</desc>
<defs><marker id="fd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9db9d6"/></marker><marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5f7391"/></marker></defs>
<rect width="856" height="252" fill="#fff"/>
<text x="24" y="22" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" letter-spacing="1" fill="#0b6d9e">EL DATO PODA ANTES QUE LA NARRATIVA</text>
<rect x="24.0" y="38" width="140.8" height="68" rx="7" fill="#f5f8fd" stroke="#0b6d9e" stroke-width="1.3"/><text x="34.0" y="57" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#0b6d9e">Datos de entrada</text><text x="34.0" y="72" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">serie, magnitud, flujo o</text><text x="34.0" y="83" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">rango, con unidad y fuente</text>
<line x1="169.8" y1="72.0" x2="186.8" y2="72.0" stroke="#9db9d6" stroke-width="1.6" marker-end="url(#fd)"/>
<rect x="190.8" y="38" width="140.8" height="68" rx="7" fill="#fff" stroke="#173b6c" stroke-width="1.3"/><text x="200.8" y="57" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#173b6c">Filtro estructural</text><text x="200.8" y="72" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">descarta lo que la forma del</text><text x="200.8" y="83" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">dato no admite</text>
<line x1="336.6" y1="72.0" x2="353.6" y2="72.0" stroke="#9db9d6" stroke-width="1.6" marker-end="url(#fd)"/>
<rect x="357.6" y="38" width="140.8" height="68" rx="7" fill="#fff" stroke="#173b6c" stroke-width="1.3"/><text x="367.6" y="57" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#173b6c">&#193;ngulos posibles</text><text x="367.6" y="72" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">dos o tres entre los que</text><text x="367.6" y="83" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">sobrevivieron</text>
<line x1="503.4" y1="72.0" x2="520.4" y2="72.0" stroke="#9db9d6" stroke-width="1.6" marker-end="url(#fd)"/>
<rect x="524.4" y="38" width="140.8" height="68" rx="7" fill="#fff" stroke="#173b6c" stroke-width="1.3"/><text x="534.4" y="57" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#173b6c">Plantilla</text><text x="534.4" y="72" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">diez disponibles</text>
<line x1="670.2" y1="72.0" x2="687.2" y2="72.0" stroke="#9db9d6" stroke-width="1.6" marker-end="url(#fd)"/>
<rect x="691.2" y="38" width="140.8" height="68" rx="7" fill="#f5f8fd" stroke="#0b6d9e" stroke-width="1.3"/><text x="701.2" y="57" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#0b6d9e">HTML de 14 segundos</text><text x="701.2" y="72" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">cuadrado, listo para grabar</text>
<line x1="261.2" y1="108" x2="261.2" y2="136" stroke="#b33a3a" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#fg)" opacity=".8"/>
<rect x="185.8" y="140" width="150.8" height="70" rx="7" fill="#fdf4f4" stroke="#b33a3a" stroke-width="1.3"/><text x="195.8" y="159" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#b33a3a">No sobrevive ninguno</text><text x="195.8" y="174" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">la forma del dato no admite ese</text><text x="195.8" y="185" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">gr&#225;fico</text>
<line x1="428.0" y1="108" x2="428.0" y2="136" stroke="#0f6b46" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#fg)" opacity=".8"/>
<rect x="352.6" y="140" width="150.8" height="70" rx="7" fill="#f1f7f4" stroke="#0f6b46" stroke-width="1.3"/><text x="362.6" y="159" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#0f6b46">Elige el usuario</text><text x="362.6" y="174" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">la narrativa escoge entre lo que</text><text x="362.6" y="185" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">qued&#243;</text>
<line x1="761.6" y1="108" x2="761.6" y2="136" stroke="#8a6d1f" stroke-width="1.4" stroke-dasharray="3 3" marker-end="url(#fg)" opacity=".8"/>
<rect x="681.2" y="140" width="150.8" height="70" rx="7" fill="#faf6ec" stroke="#8a6d1f" stroke-width="1.3"/><text x="691.2" y="159" font-family="Poppins,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#8a6d1f">Precisi&#243;n y colisiones</text><text x="691.2" y="174" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">un solo dato mal mata la pieza</text><text x="691.2" y="185" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="8.2" fill="#5f7391">entera</text>
<rect x="24" y="227" width="11" height="11" rx="3" fill="#0f6b46"/>
<text x="41" y="236" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="9" fill="#5f7391">Decide una persona</text>
<rect x="147.19" y="227" width="11" height="11" rx="3" fill="#8a6d1f"/>
<text x="164.19" y="236" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="9" fill="#5f7391">Vuelve atrás</text>
<rect x="243.65" y="227" width="11" height="11" rx="3" fill="#b33a3a"/>
<text x="260.65" y="236" font-family="'Open Sans',Helvetica,Arial,sans-serif" font-size="9" fill="#5f7391">Se detiene</text>
</svg>